apiVersion: apps/v1
kind: Deployment
metadata:
  name: divide-service
  namespace: calculator
  labels: { app: divide-service, part-of: calculator }
spec:
  replicas: 1   # tăng tối đa 3 (bằng số partition) để chia tải: kubectl -n calculator scale deploy/divide-service --replicas=3
  selector:
    matchLabels: { app: divide-service }
  template:
    metadata:
      labels: { app: divide-service, part-of: calculator }
    spec:
      enableServiceLinks: false
      containers:
        - name: divide-service
          image: calc/divide-service:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: calc-config }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: { drop: ["ALL"] }
