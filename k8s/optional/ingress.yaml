# Cần Ingress controller (vd: minikube addons enable ingress). Thêm "127.0.0.1 calculator.local" vào /etc/hosts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calculator
  namespace: calculator
spec:
  ingressClassName: nginx
  rules:
    - host: calculator.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
