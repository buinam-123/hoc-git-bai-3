# Tự co giãn số bản sao theo CPU. Cần metrics-server (minikube addons enable metrics-server).
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: add-service
  namespace: calculator
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: add-service }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
